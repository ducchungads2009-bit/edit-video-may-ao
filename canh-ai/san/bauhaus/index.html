<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<!-- CẢNH DỰNG SẴN "bauhaus" — mẫu 042 Áp phích Bauhaus: khối hình học đỏ / vàng / xanh trượt vào theo lưới, số liệu chữ khối đen
     to, nhãn nhỏ in hoa. 6 giây. Mở đầu, khoe 1–3 con số (giá, diện tích, lãi suất…), hoặc kết bài.
     data: che ("so" số liệu | "mo" mở đầu | "ket" kết bài), tieuDe, phuDe, so ([{gt: "4,2 tỷ", nhan: "Giá từ"}, …] tối đa 3),
           cta, sdt, nen ("kem" kín khung | "trong" nền trong suốt — khối hình vẫn hiện), y (đỉnh vùng chữ, mặc định 1000) -->
<link rel="stylesheet" href="./lib/fonts/fonts.css" />
<script src="./lib/runtime/scene.js"></script>
<style>
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
  .sh { position:absolute; }
  #title { position:absolute; left:90px; right:90px; font-family:'Anton', sans-serif; font-size:108px; line-height:1.24; color:#111;
           text-transform:uppercase; letter-spacing:0.01em; }
  #sub { position:absolute; left:90px; right:90px; font-family:'Montserrat', sans-serif; font-weight:600; font-size:38px; color:#111; letter-spacing:0.06em; }
  .stat { position:absolute; left:90px; right:90px; height:170px; display:flex; align-items:center; gap:34px; }
  .stat .bar { width:22px; height:130px; }
  .stat .gt { font-family:'Anton', sans-serif; font-size:124px; color:#111; line-height:1; }
  .stat .nh { font-family:'Montserrat', sans-serif; font-weight:700; font-size:34px; color:#111; letter-spacing:0.14em; text-transform:uppercase; max-width:360px; line-height:1.25; }
  #cta { position:absolute; left:90px; background:#111; color:#F2EAD8; font-family:'Montserrat', sans-serif; font-weight:700; font-size:40px; padding:26px 46px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
  <div id="bg" class="sh" style="left:0;top:0;width:1080px;height:1920px;background:#F2EAD8"></div>
  <div id="c1" class="sh" style="width:520px;height:520px;border-radius:50%;background:#D7322A"></div>
  <div id="r1" class="sh" style="width:380px;height:380px;background:#F2B705"></div>
  <div id="h1" class="sh" style="width:560px;height:280px;border-radius:280px 280px 0 0;background:#1F4E9C"></div>
  <div id="l1" class="sh" style="height:16px;background:#111"></div>
  <div id="title"></div>
  <div id="sub"></div>
  <div id="stats"></div>
  <div id="cta"></div>
</div>
<script>
  const D = window.CANH.data;
  const { prog, ease, lerp } = VideoScene;
  const CHE = D.che || 'so';
  const TRONG = D.nen === 'trong';
  const Y = Number(D.y) || (TRONG ? 1000 : 980);
  const $ = (id) => document.getElementById(id);
  const COLS = ['#D7322A', '#F2B705', '#1F4E9C'];
  const so = (Array.isArray(D.so) ? D.so : [{ gt: '4,2 tỷ', nhan: 'Giá từ' }, { gt: '120 m²', nhan: 'Diện tích' }, { gt: '0%', nhan: 'Lãi suất 24 tháng' }]).slice(0, 3);
  VideoScene.define({
    duration: 6, fps: 30, width: 1080, height: 1920,
    setup() {
      if (TRONG) $('bg').style.display = 'none';
      const ttl = D.tieuDe || (CHE === 'ket' ? 'Đặt lịch xem nhà' : CHE === 'mo' ? 'Sự thật về giá' : 'Con số nói lên tất cả');
      $('title').textContent = ttl;
      $('sub').textContent = D.phuDe || '';
      if (TRONG) { for (const id of ['title', 'sub']) { $(id).style.color = '#fff'; $(id).style.textShadow = '0 4px 18px rgba(0,0,0,.45)'; } }
      if (CHE === 'so') {
        so.forEach((s, i) => {
          const el = document.createElement('div'); el.className = 'stat'; el.id = 'st' + i;
          el.innerHTML = `<div class="bar" style="background:${COLS[i % 3]}"></div><div class="gt"></div><div class="nh"></div>`;
          el.querySelector('.gt').textContent = s.gt || ''; el.querySelector('.nh').textContent = s.nhan || '';
          if (TRONG) { el.style.background = 'rgba(242,234,216,0.94)'; el.style.paddingLeft = '30px'; }
          $('stats').appendChild(el);
        });
      }
      const ct = CHE === 'ket' ? [D.cta || 'Liên hệ ngay', D.sdt].filter(Boolean).join(' · ') : (D.cta || '');
      $('cta').textContent = ct; if (!ct) $('cta').style.display = 'none';
    },
    render(t) {
      const io = (a, d) => ease.outExpo(prog(t, a, d));
      // khối hình học trượt vào theo lưới, sau đó trôi chậm (không đứng im)
      const drift = Math.sin(t * 0.9) * 8;
      const k1 = io(0, 0.7), k2 = io(0.2, 0.7), k3 = io(0.4, 0.7), k4 = io(0.6, 0.6);
      const top = TRONG ? 140 : 160;
      $('c1').style.left = lerp(1200, 560, k1) + 'px'; $('c1').style.top = top + drift + 'px';
      $('r1').style.left = '90px'; $('r1').style.top = lerp(-420, top + 70, k2) + 'px';
      $('r1').style.transform = `rotate(${lerp(-30, 0, k2) + drift * 0.2}deg)`;
      $('h1').style.left = lerp(-600, 260, k3) + 'px'; $('h1').style.top = top + 480 - drift + 'px';
      $('l1').style.left = '90px'; $('l1').style.top = Y - 60 + 'px'; $('l1').style.width = 900 * k4 + 'px';
      if (TRONG) { $('c1').style.opacity = 0.92; $('h1').style.opacity = 0.92; }
      const tk = io(0.7, 0.6);
      $('title').style.top = Y + 'px'; $('title').style.opacity = tk; $('title').style.transform = `translateX(${lerp(-60, 0, tk)}px)`;
      const th = $('title').offsetHeight;
      const sk = io(1.0, 0.5);
      $('sub').style.top = Y + th + 24 + 'px'; $('sub').style.opacity = sk;
      let yy = Y + th + ($('sub').textContent ? 100 : 50);
      so.forEach((s, i) => {
        const el = $('st' + i); if (!el) return;
        const k = io(1.2 + i * 0.35, 0.6);
        el.style.top = yy + i * 190 + 'px'; el.style.opacity = k; el.style.transform = `translateX(${lerp(120, 0, k)}px)`;
      });
      const ck = io(1.6, 0.5);
      $('cta').style.top = (CHE === 'so' ? yy + so.length * 190 + 30 : yy + 20) + 'px';
      $('cta').style.opacity = ck; $('cta').style.transform = `translateY(${lerp(30, 0, ck)}px)`;
    },
  });
</script>
</body>
</html>
