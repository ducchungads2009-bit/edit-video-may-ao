<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<!-- CẢNH DỰNG SẴN "tin-nhan" — ý từ mẫu 007 Truyện tin nhắn: khung chat nổi trên video, từng tin hiện ra sau dấu "đang nhập…".
     Hợp: câu hỏi khách hay hỏi + trả lời, review khách, kịch bản hài. Nền trong suốt, độ dài tự theo số tin (khối dài bao nhiêu thì đặt end).
     data: ten (tên người chat ở đầu khung), tin ([{ai: "khach"|"toi", text: "…"}, …] tối đa 6), giaoDien ("sang" | "toi"),
           mau (màu bong bóng của "toi", mặc định màu nhấn), y (đỉnh khung, mặc định 760), cach (giây giữa 2 tin, mặc định 1.1) -->
<link rel="stylesheet" href="./lib/fonts/fonts.css" />
<script src="./lib/runtime/scene.js"></script>
<style>
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
  #box { position:absolute; left:90px; width:900px; border-radius:44px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.35); }
  #head { height:110px; display:flex; align-items:center; gap:22px; padding:0 34px; font-family:'Be Vietnam Pro', sans-serif; font-weight:700; font-size:38px; }
  #ava { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:#fff; }
  #list { position:relative; padding:24px 30px 34px; }
  .b { max-width:640px; padding:24px 32px; border-radius:34px; font-family:'Be Vietnam Pro', sans-serif; font-size:40px; line-height:1.3; margin-top:18px; }
  .khach { border-bottom-left-radius:10px; }
  .toi { margin-left:auto; border-bottom-right-radius:10px; color:#fff; }
  .typing { display:flex; gap:12px; padding:30px 34px; width:fit-content; }
  .typing i { width:16px; height:16px; border-radius:50%; display:block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
  <div id="box"><div id="head"><div id="ava"></div><div id="nm"></div></div><div id="list"></div></div>
</div>
<script>
  const D = window.CANH.data, ST = window.CANH.style || {};
  const { prog, ease, lerp } = VideoScene;
  const $ = (id) => document.getElementById(id);
  const TOI = D.giaoDien === 'toi';
  const ACC = D.mau || ST.accent || '#2F7CF6';
  const GAP = Number(D.cach) || 1.1;
  const tin = (Array.isArray(D.tin) && D.tin.length ? D.tin : [
    { ai: 'khach', text: 'Căn này còn không anh?' }, { ai: 'toi', text: 'Còn 2 căn góc thôi ạ 🙌' },
    { ai: 'khach', text: 'Giá bao nhiêu vậy?' }, { ai: 'toi', text: 'Inbox em gửi bảng giá nhé!' }]).slice(0, 6);
  const at = (i) => 0.5 + i * GAP + 0.45; // mốc tin i hiện (sau 0,45s "đang nhập")
  VideoScene.define({
    duration: 8, fps: 30, width: 1080, height: 1920,
    setup() {
      $('box').style.top = (Number(D.y) || 760) + 'px';
      $('box').style.background = TOI ? 'rgba(18,20,26,0.92)' : 'rgba(255,255,255,0.97)';
      $('head').style.background = TOI ? 'rgba(255,255,255,0.06)' : '#F3F4F6';
      $('head').style.color = TOI ? '#fff' : '#111';
      $('ava').style.background = ACC; $('ava').textContent = (D.ten || 'Khách hàng').trim()[0].toUpperCase();
      $('nm').textContent = D.ten || 'Khách hàng';
      tin.forEach((m, i) => {
        const ty = document.createElement('div'); ty.className = 'b khach typing'; ty.id = 'ty' + i;
        ty.style.background = TOI ? '#2A2D35' : '#ECEDEF';
        if (m.ai === 'toi') { ty.style.marginLeft = 'auto'; ty.style.background = ACC; }
        ty.innerHTML = '<i></i><i></i><i></i>';
        ty.querySelectorAll('i').forEach((d) => (d.style.background = m.ai === 'toi' ? '#fff' : (TOI ? '#9CA3AF' : '#9CA3AF')));
        const b = document.createElement('div'); b.className = 'b ' + (m.ai === 'toi' ? 'toi' : 'khach'); b.id = 'b' + i; b.textContent = m.text;
        if (m.ai === 'toi') b.style.background = ACC; else { b.style.background = TOI ? '#2A2D35' : '#ECEDEF'; b.style.color = TOI ? '#fff' : '#111'; }
        $('list').append(ty, b);
      });
    },
    render(t) {
      const bk = ease.outCubic(prog(t, 0, 0.45));
      $('box').style.opacity = bk; $('box').style.transform = `translateY(${lerp(50, 0, bk)}px)`;
      tin.forEach((m, i) => {
        const a = at(i), ty = $('ty' + i), b = $('b' + i);
        const typing = t >= a - 0.45 && t < a;
        ty.style.display = typing ? 'flex' : 'none';
        ty.querySelectorAll('i').forEach((d, k) => (d.style.transform = `translateY(${-8 * Math.max(0, Math.sin((t * 9) - k * 0.9))}px)`));
        const k = ease.outBack(prog(t, a, 0.35));
        b.style.display = t >= a ? 'block' : 'none';
        b.style.transform = `scale(${lerp(0.6, 1, k)})`; b.style.transformOrigin = m.ai === 'toi' ? '100% 100%' : '0 100%';
        b.style.opacity = prog(t, a, 0.15);
      });
    },
  });
</script>
</body>
</html>
